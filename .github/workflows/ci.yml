name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: "Quality gates"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      # The four gates from docs/development.md - in the same order.
      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src

      # Tests substitute a scripted LLM and hash embeddings, so no Ollama
      # service is needed here - the suite runs offline.
      - name: Test
        run: uv run pytest --cov=arthur --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # chromadb and pypdf are optional extras, so the job above never executes
  # ChromaVectorStore or the PDF extractor. This one installs them and runs
  # the whole suite again - including mypy, which only sees chromadb's real
  # types (not Any) once it is installed.
  extras:
    name: "Optional extras"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install with all extras
        run: uv sync --locked --all-extras

      - name: Type check with extras visible
        run: uv run mypy src

      - name: Test
        run: uv run pytest

  # Confirms the package builds and the console script actually runs.
  package:
    name: "Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Smoke test the wheel
        run: |
          uv venv .smoke
          uv pip install --python .smoke dist/*.whl
          ./.smoke/bin/arthur --version
          ./.smoke/bin/arthur tools list >/dev/null

  docker:
    name: "Docker"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t arthur:ci .

      - name: Smoke test the image
        run: |
          docker run --rm arthur:ci --version
          docker run --rm arthur:ci tools list >/dev/null
